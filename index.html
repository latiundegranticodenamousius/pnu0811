<!DOCTYPE html>

        </div>

        <!-- Meta Selectors (Period, Subject, Type) -->

          <div>

            <select id="item-period" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-800 text-sm">

              <option value="1학년 2학기">1학년 2학기</option>

            <input type="text" id="item-subject" placeholder="예: 수학, 컴퓨터공학" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-800 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">종류</label>
            <select id="item-type" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-800 text-sm">

            </select>
          </div>
        </div>

        <!-- Target Link URL -->
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">이동 URL / 경로 (선택)</label>
          <input type="text" id="item-link-url" placeholder="예: ./data1/index.html 또는 https://..." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-800 text-sm">

        <!-- Description -->

          <textarea id="item-desc" rows="4" required placeholder="수행한 작업이나 프로젝트에 대한 자세한 설명을 입력하세요." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-800 resize-none text-sm"></textarea>

          <div class="flex flex-col gap-2">

          </div>
        </div>

        <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
          <button type="button" onclick="closeItemModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100">취소</button>
          <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. Category Manager Modal -->
  <div id="category-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="tags" class="w-5 h-5 text-emerald-600"></i>

        </h3>
        <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Add New Category -->
      <div class="flex gap-2 mb-4">
        <input type="text" id="new-category-input" placeholder="새 종류 이름 (예: 논문, 캡스톤)" class="flex-1 px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
        <button onclick="addNewCategory()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl">추가</button>

      <!-- Existing Categories List -->
      <div class="max-h-60 overflow-y-auto space-y-2 pr-1" id="category-list-container">

  <!-- 4. Custom UI Confirm / Alert / Prompt Modal -->
  <div id="custom-ui-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center">
      <div id="custom-ui-icon" class="mx-auto flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 mb-4">
        <i data-lucide="info" class="w-6 h-6"></i>
      </div>
      <h4 id="custom-ui-title" class="text-base font-bold text-slate-800 mb-2">알림</h4>
      <p id="custom-ui-message" class="text-xs text-slate-600 mb-4 leading-relaxed"></p>
      
      <div id="custom-ui-input-container" class="mb-4 hidden">
        <input type="text" id="custom-ui-input" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
      </div>

      <div class="flex justify-center gap-2">
        <button id="custom-ui-cancel-btn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 hidden">취소</button>
        <button id="custom-ui-ok-btn" class="px-5 py-2 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md">확인</button>
      </div>
    </div>
  </div>

  <!-- Firebase Integration & App Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // Application State
    let profileData = {
      name: "라티운데그랑티코 대나무시어스 대식 1세 the 쌍곡선 대나무",
      bio: "쌍곡선의 곡률을 닮은 대나무처럼 곧고 유연하게 학습하고 기록하는 포트폴리오 공간입니다. 클릭하여 자기소개를 수정하세요."
    };

    let categories = ["프로젝트", "과제", "실습", "수상", "동아리", "자격증"];

    let items = [
      {

        period: "2학년 1학기",
        subject: "고급수학 및 구조역학",
        type: "프로젝트",
        desc: "쌍곡선 곡면 구조를 가진 대나무 건축물의 인장 강도와 복원력을 측정하고 시뮬레이션한 산출물입니다.",
        linkUrl: "./data2/index.html",
        fileName: "쌍곡선_구조_보고서.pdf",
        fileData: "data:application/pdf;base64,demo",
        createdAt: Date.now() - 10000000

      {
        id: "demo-2",
        title: "대나무 알고리즘을 활용한 데이터 시각화",
        period: "1학년 2학기",
        subject: "컴퓨터프로그래밍",

        desc: "대나무 마디처럼 계층적인 트리 알고리즘을 구축하여 복잡한 학업 포트폴리오 데이터를 가공하는 웹 앱 개발.",
        linkUrl: "./data1/index.html",

    let currentViewMode = 'all';

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // UI Helper for Alerts & Confirms
    window.showCustomModal = function({ title = "알림", message = "", showInput = false, defaultValue = "", showCancel = false, onOk = null }) {
      return new Promise((resolve) => {
        const modal = document.getElementById('custom-ui-modal');
        const titleEl = document.getElementById('custom-ui-title');
        const messageEl = document.getElementById('custom-ui-message');
        const inputContainer = document.getElementById('custom-ui-input-container');
        const inputEl = document.getElementById('custom-ui-input');
        const cancelBtn = document.getElementById('custom-ui-cancel-btn');
        const okBtn = document.getElementById('custom-ui-ok-btn');

        titleEl.innerText = title;
        messageEl.innerText = message;

        if (showInput) {
          inputContainer.classList.remove('hidden');
          inputEl.value = defaultValue;
        } else {
          inputContainer.classList.add('hidden');
        }

        if (showCancel) {
          cancelBtn.classList.remove('hidden');
        } else {
          cancelBtn.classList.add('hidden');
        }

        modal.classList.remove('hidden');

        const cleanup = () => {
          modal.classList.add('hidden');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        okBtn.onclick = () => {
          const val = showInput ? inputEl.value : true;
          cleanup();
          if (onOk) onOk(val);
          resolve(val);
        };

        cancelBtn.onclick = () => {
          cleanup();
          resolve(false);
        };
      });
    };

    // Firebase Initialization & Sync Setup
    async function initFirebase() {
      if (typeof __firebase_config === 'undefined' || !__firebase_config) {
        console.warn("Firebase config is missing. Falling back to LocalStorage.");
        document.getElementById('sync-status-text').innerText = "로컬 저장 모드";
        loadDataFromLocal();
        renderProfile();
        renderItems();
        return;
      }

      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          if (user) {
            document.getElementById('sync-status-text').innerText = "실시간 클라우드 연동됨";
            setupFirestoreListeners();
          }
        });
      } catch (err) {
        console.error("Firebase Auth initialization error:", err);
        document.getElementById('sync-status-text').innerText = "로컬 모드 (연결 실패)";
        loadDataFromLocal();
        renderProfile();
        renderItems();
      }
    }

    // Firestore Listeners (RULE 1 & RULE 2 & RULE 3)
    function setupFirestoreListeners() {
      if (!currentUser || !db) return;

      // 1. Profile Doc Listener
      const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profile_data', 'main');
      onSnapshot(profileRef, (snapshot) => {
        if (snapshot.exists()) {
          profileData = snapshot.data();
        } else {
          setDoc(profileRef, profileData);
        }
        renderProfile();
      }, (error) => {
        console.error("Profile snapshot error:", error);
      });

      // 2. Categories Doc Listener
      const categoryRef = doc(db, 'artifacts', appId, 'public', 'data', 'category_data', 'main');
      onSnapshot(categoryRef, (snapshot) => {
        if (snapshot.exists() && snapshot.data().list) {
          categories = snapshot.data().list;
        } else {
          setDoc(categoryRef, { list: categories });
        }
        renderCategoryList();
        populateTypeDropdown();
      }, (error) => {
        console.error("Categories snapshot error:", error);
      });

      // 3. Items Collection Listener
      const itemsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'portfolio_items');
      onSnapshot(itemsColRef, (snapshot) => {
        const loadedItems = [];
        snapshot.forEach((docSnap) => {
          loadedItems.push({ id: docSnap.id, ...docSnap.data() });
        });

        if (loadedItems.length === 0 && !snapshot.metadata.hasPendingWrites) {
          // Seed initial items if completely empty
          items.forEach(async (item) => {
            const { id, ...data } = item;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'portfolio_items', id), data);
          });
        } else {
          items = loadedItems;
          renderItems();
        }
      }, (error) => {
        console.error("Items snapshot error:", error);
      });
    }

    // Local Storage Fallback Helpers
    function saveDataToLocal() {
      localStorage.setItem('bamboo_portfolio_profile', JSON.stringify(profileData));
      localStorage.setItem('bamboo_portfolio_categories', JSON.stringify(categories));
      localStorage.setItem('bamboo_portfolio_items', JSON.stringify(items));
    }

    function loadDataFromLocal() {
      const savedProfile = localStorage.getItem('bamboo_portfolio_profile');
      const savedCategories = localStorage.getItem('bamboo_portfolio_categories');
      const savedItems = localStorage.getItem('bamboo_portfolio_items');

      if (savedProfile) profileData = JSON.parse(savedProfile);
      if (savedCategories) categories = JSON.parse(savedCategories);
      if (savedItems) items = JSON.parse(savedItems);
    }

    // Render Profile UI
    window.renderProfile = function() {
      document.getElementById('user-name-display').childNodes[0].nodeValue = profileData.name + " ";
      document.getElementById('user-bio-display').innerText = profileData.bio;
    };

    window.openProfileModal = function() {
      document.getElementById('edit-user-name').value = profileData.name;
      document.getElementById('edit-user-bio').value = profileData.bio;
      document.getElementById('profile-modal').classList.remove('hidden');
    };

    window.closeProfileModal = function() {
      document.getElementById('profile-modal').classList.add('hidden');
    };

    window.saveProfile = async function() {
      const nameVal = document.getElementById('edit-user-name').value.trim();
      const bioVal = document.getElementById('edit-user-bio').value.trim();

      if (nameVal) profileData.name = nameVal;
      profileData.bio = bioVal;

      if (currentUser && db) {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profile_data', 'main'), profileData);
      } else {
        saveDataToLocal();
        renderProfile();
      }
      closeProfileModal();
    };

    // View Mode Switcher
    window.setViewMode = function(mode) {
      currentViewMode = mode;
      document.querySelectorAll('.view-btn').forEach(btn => {
        if (btn.dataset.mode === mode) {
          btn.className = "view-btn flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-slate-800 shadow-sm";
        } else {
          btn.className = "view-btn flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900";
        }
      });
      renderItems();
    };

    // Render Items Function
    window.renderItems = function() {
      const container = document.getElementById('content-container');
      const sortOrder = document.getElementById('sort-order').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

      let filtered = items.filter(item => {
        const matchesTitle = item.title.toLowerCase().includes(searchQuery);
        const matchesDesc = item.desc.toLowerCase().includes(searchQuery);
        const matchesSubject = item.subject.toLowerCase().includes(searchQuery);
        const matchesType = item.type.toLowerCase().includes(searchQuery);
        return matchesTitle || matchesDesc || matchesSubject || matchesType;
      });

      filtered.sort((a, b) => {
        return sortOrder === 'newest' ? b.createdAt - a.createdAt : a.createdAt - b.createdAt;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 text-center border border-dashed border-slate-300">
            <i data-lucide="folder-open" class="w-12 h-12 mx-auto text-slate-300 mb-3"></i>
            <h4 class="text-base font-semibold text-slate-600">등록된 항목이 없습니다.</h4>
            <p class="text-xs text-slate-400 mt-1 mb-4">새로운 학업 기록 및 프로젝트를 추가해 보세요!</p>
            <button onclick="openItemModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-md">
              + 첫 항목 추가하기
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      if (currentViewMode === 'all') {
        container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">${filtered.map(createItemCardHTML).join('')}</div>`;
      } else {
        const groups = {};
        filtered.forEach(item => {
          let key = "기타";
          if (currentViewMode === 'period') key = item.period || "시기 미정";
          if (currentViewMode === 'subject') key = item.subject || "과목 미정";
          if (currentViewMode === 'type') key = item.type || "종류 미정";

          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });

        let html = '<div class="space-y-8">';
        for (const [groupName, groupItems] of Object.entries(groups)) {
          html += `
            <section>
              <div class="flex items-center gap-2 mb-4 pb-2 border-b-2 border-emerald-500/30">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                <h3 class="text-lg font-bold text-slate-800">${groupName}</h3>
                <span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full">${groupItems.length}</span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                ${groupItems.map(createItemCardHTML).join('')}
              </div>
            </section>
          `;
        }
        html += '</div>';
        container.innerHTML = html;
      }

      lucide.createIcons();
    };

    function createItemCardHTML(item) {
      const isImage = item.fileData && item.fileData.startsWith('data:image');
      
      return `
        <div class="bg-white rounded-2xl p-5 border border-slate-200/90 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group relative overflow-hidden">
          <div class="space-y-3">
            <div class="flex flex-wrap items-center gap-1.5 text-xs font-medium">
              <span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200">${item.period}</span>
              <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md border border-emerald-100 font-semibold">${item.subject || '자율'}</span>
              <span class="bg-teal-50 text-teal-800 px-2.5 py-1 rounded-md border border-teal-100">${item.type}</span>
            </div>

            <h4 class="text-base font-bold text-slate-900 group-hover:text-emerald-700 transition-colors leading-snug">
              ${item.linkUrl ? `
                <a href="${escapeHtml(item.linkUrl)}" class="hover:underline flex items-center gap-1.5">
                  ${escapeHtml(item.title)}
                  <i data-lucide="external-link" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                </a>
              ` : escapeHtml(item.title)}
            </h4>

            <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line line-clamp-4">
              ${escapeHtml(item.desc)}
            </p>

            ${item.linkUrl ? `
              <div class="pt-1">
                <a href="${escapeHtml(item.linkUrl)}" class="inline-flex items-center gap-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg shadow-sm transition-all">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>페이지 열기 (${escapeHtml(item.linkUrl)})</span>
                </a>
              </div>
            ` : ''}

            ${item.fileName ? `
              <div class="mt-3 p-2.5 bg-slate-50 rounded-xl border border-slate-200/80 flex items-center gap-2">
                <i data-lucide="${isImage ? 'image' : 'file-text'}" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                <span class="text-xs text-slate-700 truncate flex-1 font-medium">${escapeHtml(item.fileName)}</span>
                ${item.fileData ? `
                  <a href="${item.fileData}" download="${item.fileName}" class="p-1 hover:bg-slate-200 rounded text-slate-600" title="다운로드">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  </a>
                ` : ''}
              </div>
            ` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
            <span>${new Date(item.createdAt).toLocaleDateString()}</span>
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <button onclick="editItem('${item.id}')" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 hover:text-emerald-600 transition-colors" title="수정">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteItem('${item.id}')" class="p-1.5 hover:bg-red-50 rounded-lg text-slate-600 hover:text-red-600 transition-colors" title="삭제">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Modal & Item Form Logic
    window.openItemModal = function(editId = null) {
      populateTypeDropdown();
      const form = document.getElementById('item-form');
      form.reset();
      clearFileSelection();

      if (editId) {
        const item = items.find(i => i.id === editId);
        if (item) {
          document.getElementById('modal-title').innerText = "항목 수정하기";
          document.getElementById('item-id').value = item.id;
          document.getElementById('item-title').value = item.title;
          document.getElementById('item-period').value = item.period;
          document.getElementById('item-subject').value = item.subject;
          document.getElementById('item-type').value = item.type;
          document.getElementById('item-link-url').value = item.linkUrl || '';
          document.getElementById('item-desc').value = item.desc;
          
          if (item.fileName) {
            document.getElementById('item-file-name').value = item.fileName;
            document.getElementById('item-file-data').value = item.fileData || '';
            showFilePreviewUI(item.fileName);
          }
        }
      } else {
        document.getElementById('modal-title').innerText = "새 항목 추가";
        document.getElementById('item-id').value = "";
      }

      document.getElementById('item-modal').classList.remove('hidden');
    };

    window.closeItemModal = function() {
      document.getElementById('item-modal').classList.add('hidden');
    };

    window.populateTypeDropdown = function() {
      const select = document.getElementById('item-type');
      select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    };

    window.handleFileSelected = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('item-file-name').value = file.name;
        document.getElementById('item-file-data').value = e.target.result;
        showFilePreviewUI(file.name);
      };
      reader.readAsDataURL(file);
    };

    function showFilePreviewUI(fileName) {
      const container = document.getElementById('file-preview-container');
      const nameSpan = document.getElementById('file-preview-name');
      nameSpan.innerText = fileName;
      container.classList.remove('hidden');
      container.classList.add('flex');
    }

    window.clearFileSelection = function() {
      document.getElementById('item-file-input').value = "";
      document.getElementById('item-file-name').value = "";
      document.getElementById('item-file-data').value = "";
      const container = document.getElementById('file-preview-container');
      container.classList.add('hidden');
      container.classList.remove('flex');
    };

    window.handleItemFormSubmit = async function(event) {
      event.preventDefault();

      const itemId = document.getElementById('item-id').value;
      const title = document.getElementById('item-title').value.trim();
      const period = document.getElementById('item-period').value;
      const subject = document.getElementById('item-subject').value.trim() || '일반';
      const type = document.getElementById('item-type').value;
      const linkUrl = document.getElementById('item-link-url').value.trim();
      const desc = document.getElementById('item-desc').value.trim();
      const fileName = document.getElementById('item-file-name').value;
      const fileData = document.getElementById('item-file-data').value;

      const payload = {
        title,
        period,
        subject,
        type,
        linkUrl,
        desc,
        fileName,
        fileData,
        createdAt: itemId ? (items.find(i => i.id === itemId)?.createdAt || Date.now()) : Date.now()
      };

      if (currentUser && db) {
        if (itemId) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'portfolio_items', itemId), payload);
        } else {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'portfolio_items'), payload);
        }
      } else {
        if (itemId) {
          const idx = items.findIndex(i => i.id === itemId);
          if (idx !== -1) items[idx] = { id: itemId, ...payload };
        } else {
          items.unshift({ id: 'item_' + Date.now(), ...payload });
        }
        saveDataToLocal();
        renderItems();
      }

      closeItemModal();
    };

    window.editItem = function(id) {
      openItemModal(id);
    };

    window.deleteItem = async function(id) {
      const confirmDelete = await showCustomModal({
        title: "항목 삭제",
        message: "이 항목을 정말로 삭제하시겠습니까?",
        showCancel: true
      });

      if (confirmDelete) {
        if (currentUser && db) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'portfolio_items', id));
        } else {
          items = items.filter(i => i.id !== id);
          saveDataToLocal();
          renderItems();
        }
      }
    };

    // Category Manager Operations
    window.openCategoryModal = function() {
      renderCategoryList();
      document.getElementById('category-modal').classList.remove('hidden');
    };

    window.closeCategoryModal = function() {
      document.getElementById('category-modal').classList.add('hidden');
      renderItems();
    };

    window.renderCategoryList = function() {
      const container = document.getElementById('category-list-container');
      container.innerHTML = categories.map((cat, idx) => `
        <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <span class="text-sm font-semibold text-slate-700">${escapeHtml(cat)}</span>
          <div class="flex items-center gap-1">
            <button onclick="renameCategory(${idx})" class="p-1 text-slate-500 hover:text-emerald-600" title="이름 변경">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button onclick="removeCategory(${idx})" class="p-1 text-slate-500 hover:text-red-600" title="삭제">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    };

    window.addNewCategory = async function() {
      const input = document.getElementById('new-category-input');
      const val = input.value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        input.value = "";
        await syncCategories();
        renderCategoryList();
      }
    };

    window.renameCategory = async function(index) {
      const oldVal = categories[index];
      const newVal = await showCustomModal({
        title: "종류(태그) 이름 변경",
        message: "새로운 이름을 입력하세요:",
        showInput: true,
        defaultValue: oldVal,
        showCancel: true
      });

      if (newVal && typeof newVal === 'string' && newVal.trim() !== "" && newVal !== oldVal) {
        const trimmed = newVal.trim();
        categories[index] = trimmed;
        
        items.forEach(item => {
          if (item.type === oldVal) {
            item.type = trimmed;
            if (currentUser && db) {
              updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'portfolio_items', item.id), { type: trimmed });
            }
          }
        });

        await syncCategories();
        renderCategoryList();
      }
    };

    window.removeCategory = async function(index) {
      if (categories.length <= 1) {
        showCustomModal({
          title: "알림",
          message: "최소 하나의 종류 태그는 존재해야 합니다."
        });
        return;
      }

      const targetCat = categories[index];
      const confirmRemove = await showCustomModal({
        title: "종류(태그) 삭제",
        message: `'${targetCat}' 종류를 삭제하시겠습니까?`,
        showCancel: true
      });

      if (confirmRemove) {
        categories.splice(index, 1);
        items.forEach(item => {
          if (item.type === targetCat) {
            item.type = categories[0];
            if (currentUser && db) {
              updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'portfolio_items', item.id), { type: categories[0] });
            }
          }
        });

        await syncCategories();
        renderCategoryList();
      }
    };

    async function syncCategories() {
      if (currentUser && db) {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'category_data', 'main'), { list: categories });
      } else {
        saveDataToLocal();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // App Start
    window.onload = function() {
      initFirebase();
      lucide.createIcons();
    };
  </script>
</body>
</html>
