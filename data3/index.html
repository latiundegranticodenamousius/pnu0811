<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어휴... 죄송합니다!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
        }
        @keyframes sweat-drop {
            0% { transform: translateY(-5px) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(12px) scale(1.1); opacity: 0; }
        }
        .sweat {
            animation: sweat-drop 1.5s infinite;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }
        .head-shake {
            animation: shake 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border-4 border-amber-200 p-8 text-center relative overflow-hidden">
        
        <!-- 장식용 배경 이모지 -->
        <div class="absolute -top-6 -right-6 text-7xl opacity-10 select-none">🙇‍♂️</div>
        <div class="absolute -bottom-6 -left-6 text-7xl opacity-10 select-none">💦</div>

        <!-- 캐릭터 일러스트 (SVG/아이콘 조합) -->
        <div class="relative inline-block mb-6 head-shake">
            <div class="w-32 h-32 bg-amber-100 rounded-full flex items-center justify-center border-4 border-amber-300 mx-auto shadow-inner">
                <!-- 땀 흘리며 사과하는 얼굴 이모지 -->
                <i class="fa-solid fa-face-sad-sweat text-7xl text-amber-500"></i>
            </div>
            <!-- 애니메이션 땀방울 -->
            <div class="sweat absolute top-2 right-1 text-blue-400 text-2xl">
                <i class="fa-solid fa-droplet"></i>
            </div>
        </div>

        <!-- 메인 헤드라인 -->
        <h1 class="text-4xl font-extrabold text-amber-600 mb-2 tracking-tight">
            어휴... 죄송합니다!
        </h1>
        
        <p class="text-lg font-medium text-slate-600 mb-6">
            원하시던 페이지를 찾지 못했거나<br>무언가 커다란 실수(실패)를 저질렀습니다.
        </p>

        <!-- 변명 박스 -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 text-left text-sm text-slate-600 space-y-2">
            <div class="flex items-start gap-2">
                <span class="text-amber-500 font-bold">•</span>
                <span>개발자가 코딩하다 졸았을 수도 있습니다.</span>
            </div>
            <div class="flex items-start gap-2">
                <span class="text-amber-500 font-bold">•</span>
                <span>서버가 잠시 딴청을 피우는 중일지도 모릅니다.</span>
            </div>
            <div class="flex items-start gap-2">
                <span class="text-amber-500 font-bold">•</span>
                <span>아무튼 진심으로 반성하고 있습니다... 🥺</span>
            </div>
        </div>

        <!-- 버튼 그룹 -->
        <div class="space-y-3">
            <button onclick="forgiveAction()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-heart"></i>
                <span>너그럽게 용서해주기</span>
            </button>

            <button onclick="showApologyLetter()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-6 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-scroll"></i>
                <span>반성문 작성하기</span>
            </button>

            <button onclick="history.back()" class="w-full bg-transparent hover:bg-amber-100/50 text-slate-500 font-medium py-2 px-4 rounded-xl text-sm transition-all">
                <i class="fa-solid fa-arrow-left mr-1"></i> 이전 페이지로 도망가기
            </button>
        </div>

        <!-- 푸터 메시지 -->
        <div class="mt-8 pt-4 border-t border-slate-100 text-xs text-slate-400">
            Error Code: <span class="font-mono text-amber-600 font-bold">404_OH_NO_SORRY</span>
        </div>
    </div>

    <!-- 모달 창 (알림/반성문) -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl transform transition-all scale-95 opacity-0" id="modal-content">
            <div id="modal-body"></div>
            <button onclick="closeModal()" class="mt-5 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-6 rounded-xl w-full">
                확인
            </button>
        </div>
    </div>

    <script>
        function openModal(htmlContent) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            const modalBody = document.getElementById('modal-body');

            modalBody.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');

            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 150);
        }

        function forgiveAction() {
            openModal(`
                <div class="text-5xl mb-3">🎉</div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">대인배이시군요!</h3>
                <p class="text-slate-600 text-sm">넓은 마음으로 용서해 주셔서 감사합니다.<br>앞으로 더 열심히 하는 시스템이 되겠습니다!</p>
            `);
        }

        function showApologyLetter() {
            openModal(`
                <div class="text-4xl mb-2">✍️</div>
                <h3 class="text-lg font-bold text-slate-800 mb-3">반성문</h3>
                <div class="text-left text-xs text-slate-600 bg-amber-50 p-3 rounded-lg border border-amber-200 leading-relaxed space-y-2">
                    <p><strong>제목: 진심으로 사과드립니다.</strong></p>
                    <p>본 시스템은 사용자의 요청을 올바르게 처리하지 못하고 "어휴 죄송" 상황을 발생시켰음을 깊이 반성합니다.</p>
                    <p>다시는 딴짓을 하지 않고, 빠른 데이터 전송과 정확한 버그 수정을 약속드립니다.</p>
                    <p class="text-right text-slate-400 mt-2">- 올림 -</p>
                </div>
            `);
        }
    </script>
</body>
</html>
